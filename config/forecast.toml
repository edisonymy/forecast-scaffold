# forecast-scaffold configuration template.
#
# Everything that churns — model preferences, draw counts, clamps, blend weights — lives
# here, never in the skills' markdown. Copy this file next to your journal (or point
# $FORECAST_CONFIG at it) and edit freely; missing keys fall back to built-in defaults.
# This template mirrors core.DEFAULTS exactly (a test asserts it).

[clamp]
# Final probabilities outside this band trigger a warning and are clamped by `aggregate`.
# 38% of tournament-winning bots clamp to roughly this band. Override deliberately when
# evidence is genuinely overwhelming and documented.
min = 0.02
max = 0.98

# draws      = in-context estimates within one run (works on every surface, but they are
#              CORRELATED — they see each other — and headless agents under-execute them).
# runs       = independent runs a harness (bot/bench/subagents) launches and pools with
#              geo_mean_odds. The deterministic effort lever; unavailable in a plain chat,
#              where the skill falls back to in-context draws and says so.
# run_models = optional model ids the harness cycles through for runs after the first —
#              cross-model diversity is the strongest documented ensemble lever (tournament
#              winners average ~1.8 model families; same-model trios underperform diverse
#              ones). Empty = every run uses the command's model. Binary questions only for
#              now: MC/numeric stay single-run until a pooling rule is preregistered.
# Run counts are lean (v0.4.0): research + 2 (medium) / 3 (high) reasoning runs. This is
# a cost/quality judgment call, not a measured result: the old BTF-2 null
# (+0.0002 +/- 0.0148, n=85, v0.1.0) tested in-context draws, not this independent-runs
# architecture, and its BTF-2 corpus was later found partially contaminated (2026-07
# probe: 8/55 questions flagged) — so it neither supports nor refutes these sizes. A
# leak-free re-measurement is pending. geo_mean_odds pools untrimmed; the suggested-angle
# rotation leads with the counter-biasing opposite pair so any k >= 2 stays directionally
# neutral.
# min_sources = floor on DISTINCT actually-consulted sources the research (full) run must
#               return; announced in its prompt and enforced by the bot's validate/repair
#               loop BEFORE any forecast is accepted (reasoning runs are exempt — [] stays
#               honest there). Added 0.4.5: the first live batch put its most
#               crowd-divergent calls on its thinnest research (q44381 MC: 0 sources;
#               q44382/q44511: 2) — exactly the single-run paths the dossier contract
#               never covered.
# run_angles  = engineered evidence diversity. Non-empty FLIPS the bot flow: instead of one
#               shared-dossier research run + reasoning-only runs, it launches one INDEPENDENT
#               full-research run per angle letter (operator briefs in
#               skills/forecast/references/research-angles.md), then pools them. Measured why:
#               runs that share one dossier correlate ~0.97 (members disagree ~0.03), so the
#               pool equals the member average at N times the cost — evidence diversity is the
#               pooling prerequisite. DEFAULT since 2026-09-03 (operator decision): PARALLEL
#               RESEARCH — "P" is a plain replicate (full research, no lens); medium runs three,
#               high four. [] = the dossier fallback. All question types pool (binary: geo-mean
#               odds; continuous: per-percentile mean; MC: per-option geometric mean).
# share_evidence = angle mode only, PHASE 2. Every angle run also writes the estimate-free
#               dossier; once they have all finished, each run gets ONE reasoning-only call
#               carrying its own dossier plus the other runs' dossiers — evidence, never their
#               numbers or reasoning — and those second estimates are pooled instead. Shared
#               evidence, independent judgment (the "blackboard" row of
#               docs/research-notes-multiagent-forecasting-2026-09-03.md). OFF at every tier
#               (operator, 2026-09-03): an experiment switch, not production. It adds ~$1.3 a
#               question at medium, and circulating others' views is the documented way to
#               collapse ensemble variance WITHOUT improving accuracy (Lorenz et al. 2011) —
#               bench/analysis/phase_pools.py scores both pools and checks for exactly that.
# supervisor  = angle mode only, PHASE 3. One reconciler call receives every dossier and every
#               run's estimate WITH its reasoning, lists the disagreements, classifies each
#               FACTUAL or JUDGMENT, settles the factual ones, and issues the final number in
#               the question's own contract. It is told NOT to average or split the difference:
#               the pools are the averaging arm, they are journaled beside it, and the paired
#               comparison decides. The one interactive design with forecasting-specific
#               quantitative evidence (AIA Forecaster: 0.1182 mean-of-10 -> 0.1125 reconciled).
# supervisor_search_spread / supervisor_search_spread_iqr = when the reconciler gets web tools.
#               Runs that already agree have no factual dispute worth searching, so below the
#               threshold the reconciler runs REASONING-ONLY (cheap, no web); at or above it it
#               runs research-capable with up to `searches` targeted searches (~$1.0-1.5 more,
#               only on the questions that disagree). The first threshold is on a probability
#               scale (binary: max-min of the run probabilities; MC: max-min of the pooled
#               leader's probability). The second is for continuous questions and is in IQR
#               units: max-min of the run medians divided by the pooled p75-p25, so 1.0 means
#               "the medians differ by a full interquartile range". Unused where supervisor is
#               false (kept on every tier so flipping the switch needs no other edit).
#
# RESEARCH DEPTH IS UNIFORM ACROSS TIERS (operator, 2026-09-03): searches = 5 and
# min_sources = 3 at every tier. A tier says how much INDEPENDENT JUDGMENT a question gets —
# how many runs, and what synthesizes them (runs / run_angles / supervisor) — never how
# carefully a single run reads the world. The old ladder (1/5/12 searches, 1/3/5 sources)
# made a low-tier run research badly on purpose, and that is the one economy the survey
# evidence contradicts outright: "research sources used" is the strongest measured
# correlate of bot performance (r = +0.42, p = .006, Fall 2025 FutureEval survey, winners
# averaging 1.75 sources vs 1.00), while aggregation counts were not significant.
[tiers.low]
draws = 1
searches = 5
runs = 1
run_models = []
min_sources = 3
run_angles = []
share_evidence = false
supervisor = false
supervisor_search_spread = 0.10
supervisor_search_spread_iqr = 0.75

[tiers.medium]
draws = 5
searches = 5
runs = 3
run_models = []
min_sources = 3
run_angles = ["P", "P", "P"]
share_evidence = false
supervisor = true
supervisor_search_spread = 0.10
supervisor_search_spread_iqr = 0.75

# Candidate future high-tier upgrade (NOT implemented): disjoint-retrieval runs — each run
# researches its own sources instead of sharing one dossier. Half-validated externally
# (source-split agents beat shared-source agents) and it is the regime where extremizing
# becomes legitimate; gated on the issue #9 evidence-elasticity result before any build.
[tiers.high]
draws = 12
searches = 5
runs = 4
run_models = []
min_sources = 3
run_angles = ["P", "P", "P", "P"]
share_evidence = false
supervisor = true
supervisor_search_spread = 0.08
supervisor_search_spread_iqr = 0.5

[blend]
# Weight on the crowd/market number when one exists — used by the chat/CLI aggregate
# path when the SAME question's human crowd/market value is passed explicitly (Halawi's
# validated 4:1-crowd optimum applies there). The BOT harness never blends (v0.4.11,
# operator decision): cross-platform contract equivalence takes judgment, so market
# anchoring lives in the agent's research step, disclosed in its reasoning.
crowd_weight = 0.8

[aggregation]
# "trimmed_mean" for correlated draws from one forecaster (the default);
# "geo_mean_odds" for genuinely independent forecasters/agents; "median" as a robust fallback.
method = "trimmed_mean"

[journal]
path = "forecasts.jsonl"

[models]
# Hints for the host agent — the scaffold never calls models itself. Model choice dominates
# scaffolding, so revisit these regularly; leave triage empty to let the host agent decide.
triage = ""
notes = "model choice dominates scaffolding; keep this fresh"
