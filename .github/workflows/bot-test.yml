name: Bot dry run / testing area

on:
  workflow_dispatch:
    inputs:
      tournament:
        description: "Tournament id or slug (ignored when 'post' is set)"
        required: false
      post:
        description: "Single post id to backtest/re-forecast (implies dry-run; forecasts one closed or open question)"
        required: false
      dry_run:
        description: "Dry run (record only, never submit)"
        type: boolean
        default: true
      limit:
        description: "Max questions this run"
        default: "3"
      blind:
        description: "Blind mode (hide the community prediction from the agent)"
        type: boolean
        default: false
      effort:
        description: "Tier: how many independent research runs (low 1, medium 3, high 4)"
        type: choice
        options: [low, medium, high]
        default: medium
      include_forecasted:
        description: "Re-forecast questions this account already forecast (testing only)"
        type: boolean
        default: false
      model:
        description: "Model for the agent (a candidate model, or a cheap one for diagnostics)"
        default: "claude-opus-5-5"
      model_effort:
        description: "The model's effort level"
        type: choice
        options: [low, medium, high, xhigh, max]
        default: high
      parallel_runs:
        description: "Research runs per question to run concurrently (1 = sequential)"
        default: "1"
      provider:
        description: "LLM billing path"
        type: choice
        options: [subscription, openrouter]
        default: subscription

permissions:
  contents: read # dry-run / testing-area runs never commit; the journal is shown in logs only

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: |
          pip install -e .
          npm install -g @anthropic-ai/claude-code@2.1.280

      - name: Research tools smoke test
        # Live calls to third-party sites: red is a signal, never a gate on the run below.
        continue-on-error: true
        run: python bot/research_tools.py --selftest

      - name: Run
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          # Subscription OAuth by default. Do NOT add ANTHROPIC_API_KEY: it takes precedence
          # and silently switches to per-token API billing. With provider=openrouter the bot
          # maps OPENROUTER_API_KEY into the CLI's env itself.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # via env, never interpolated into the shell line (script-injection safe)
          INPUT_TOURNAMENT: ${{ inputs.tournament }}
          INPUT_POST: ${{ inputs.post }}
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_PROVIDER: ${{ inputs.provider }}
          INPUT_EFFORT: ${{ inputs.effort }}
          INPUT_MODEL: ${{ inputs.model }}
          INPUT_MODEL_EFFORT: ${{ inputs.model_effort }}
          INPUT_PARALLEL_RUNS: ${{ inputs.parallel_runs }}
        run: |
          # Single-post backtest (--post, forces dry-run) or a tournament sweep — the target
          # comes via env, never interpolated into the command line. A dispatch with NO
          # target is a smoke-only run (secrets/env check): succeed without forecasting
          # instead of failing on run_bot's argparse and emailing a false alarm.
          if [ -z "$INPUT_POST" ] && [ -z "$INPUT_TOURNAMENT" ]; then
            echo "no tournament/post input — smoke-only dispatch, skipping the bot run"
            exit 0
          fi
          if [ -n "$INPUT_POST" ]; then
            target=(--post "$INPUT_POST")
          else
            target=(--tournament "$INPUT_TOURNAMENT" --limit "$INPUT_LIMIT")
          fi
          python bot/run_bot.py "${target[@]}" \
            --provider "${INPUT_PROVIDER:-subscription}" \
            --effort "${INPUT_EFFORT:-medium}" \
            --model "${INPUT_MODEL:-claude-opus-5-5}" \
            --model-effort "${INPUT_MODEL_EFFORT:-high}" \
            --budget 12 \
            --parallel-runs "${INPUT_PARALLEL_RUNS:-1}" \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.blind && '--blind' || '' }} \
            ${{ inputs.include_forecasted && '--include-forecasted' || '' }}

      - name: Show journal
        if: ${{ always() }}
        run: cat bot/journal/forecasts.jsonl || true

      - name: Upload journal and traces
        # A provider failure exits 75 and would otherwise hide the traces of the runs that
        # did complete — which is exactly what a provider-parity test needs to see.
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bot-test-journal
          path: bot/journal/
          retention-days: 14

      - name: Show backtest rows and per-call usage
        if: ${{ always() }}
        # --post backtests write to the gitignored backtests journal; print what they cost
        # and why (traces carry per-call token usage).
        run: |
          tail -n 3 bot/journal/backtests.jsonl 2>/dev/null || true
          python - <<'PY'
          import glob, json, os
          for path in sorted(glob.glob("bot/journal/traces/*.json"), key=os.path.getmtime)[-4:]:
              t = json.load(open(path, encoding="utf-8"))
              for c in t.get("calls", []):
                  print(os.path.basename(path), c.get("stage"), c.get("model"),
                        c.get("cost_usd"), c.get("seconds"), json.dumps(c.get("usage")))
          PY
