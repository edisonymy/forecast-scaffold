name: Exchange paper bot

# UK betting-exchange PAPER trader (docs/exchange-paper-policy.md). Nothing here can place an
# order: bot/exchanges.py is read-only by construction and bot/run_exchange.py journals what
# it would have done at the touch price. HOURLY: every tick quotes the tracked contracts by
# id (closing line + settlement) and records cross-venue locks at zero model credit; only
# the ticks on hours divisible by six also forecast fresh contracts. The snapshot cadence is
# what makes closing-line value and the maker-fill lower bound scorable at all.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "forecast | snapshot"
        default: "forecast"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false # never kill an in-flight forecasting run

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write # commits the public journal + price snapshots
      issues: write # the failure alert below files one deduped issue

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        # Same pinned CLI as manifold.yml: an unattended cron must not pick up a broken or
        # compromised release mid-flight. Bump deliberately, then watch one run.
        run: |
          pip install -e .
          npm install -g @anthropic-ai/claude-code@2.1.201

      - name: Decide tick mode
        id: mode
        # Forecast when the newest journaled forecast is older than 5.5 hours (about four
        # forecast ticks a day), snapshot-only otherwise. Keyed on the journal rather than
        # the wall clock so a delayed cron tick (GitHub schedules can slip by 30+ minutes)
        # cannot silently turn a forecast tick into a snapshot. A manual dispatch can force
        # either.
        run: |
          mode="${{ github.event.inputs.mode }}"
          if [ -z "$mode" ]; then
            mode=$(python - <<'PY'
          import json, pathlib
          from datetime import UTC, datetime
          newest = None
          p = pathlib.Path("bot/journal/exchange.jsonl")
          if p.exists():
              for line in p.read_text(encoding="utf-8").splitlines():
                  if not line.strip():
                      continue
                  row = json.loads(line)
                  at = row.get("forecast_at") or row.get("created")
                  if at and (newest is None or at > newest):
                      newest = at
          if newest is None:
              print("forecast"); raise SystemExit
          age_h = (datetime.now(UTC) - datetime.fromisoformat(newest.replace("Z", "+00:00"))).total_seconds() / 3600
          print("forecast" if age_h >= 5.5 else "snapshot")
          PY
            )
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "tick mode: $mode"

      - name: Run exchange paper bot
        # Subscription-only, hard-capped, deadline-bounded — the Manifold contract. Betfair
        # credentials are OPTIONAL: without them the run is Smarkets-only (public reads).
        # The Betfair app key should be the free DELAYED key; a live key is never needed.
        # Snapshot ticks make no model call and need no Claude credential.
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
          BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
        run: |
          set -o pipefail
          : "${LEAK_PATTERNS:?set the publication deny-list secret}"
          if [ "${{ steps.mode.outputs.mode }}" = "snapshot" ]; then
            python bot/run_exchange.py --snapshot-only | tee "$RUNNER_TEMP/exchange.log"
            exit 0
          fi
          : "${CLAUDE_CODE_OAUTH_TOKEN:?set the subscription setup-token secret}"
          python bot/run_exchange.py --limit 6 --tier medium --provider subscription \
            --budget 6 --deadline-minutes 45 --timeout 900 --require-subscription-auth \
            --agent-cmd "claude -p --model claude-sonnet-5 --output-format json --allowed-tools Read,Glob,Grep,WebSearch,WebFetch" \
            | tee "$RUNNER_TEMP/exchange.log"

      - name: Scoreboard
        # Offline: reads the two journal files this run just extended. Never fails the job.
        if: always()
        run: |
          {
            echo "### Exchange paper digest"
            echo
            echo '```'
            grep -hiE "pulled|snapshot|lock ledger|selected|PAPER-BET|REFORECAST|journaled|proxy|skip|credit|DEFER|failed" \
              "$RUNNER_TEMP/exchange.log" || true
            echo
            python bot/score_exchange.py || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit journal + snapshots (pre-registration)
        # always(): journaled pairs and snapshots are the public record even if a later
        # contract errored or the run timed out.
        if: always()
        env:
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
          BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
          BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
        run: |
          : "${LEAK_PATTERNS:?set the LEAK_PATTERNS secret before the bot can publish}"
          FILES="bot/journal/exchange.jsonl bot/journal/exchange-prices.jsonl bot/journal/exchange-arbs.jsonl"
          EXISTING=""
          for f in $FILES; do if [ -f "$f" ]; then EXISTING="$EXISTING $f"; fi; done
          if [ -z "$EXISTING" ]; then echo "no journal files yet — nothing to publish"; exit 0; fi
          git add -- $EXISTING
          set +e; python scripts/journal_leak_guard.py --redact-model-output $EXISTING; status=$?; set -e
          if [ "$status" -ne 0 ]; then git reset -q; exit "$status"; fi
          git add -- $EXISTING
          set +e; python scripts/journal_leak_guard.py $EXISTING; status=$?; set -e
          if [ "$status" -ne 0 ]; then git reset -q; exit "$status"; fi
          # A prompt-injected agent's visible output lands in exactly these files — scan for
          # the credential VALUES themselves, fail-closed.
          for secret in "$CLAUDE_CODE_OAUTH_TOKEN" "$BETFAIR_APP_KEY" "$BETFAIR_USERNAME" "$BETFAIR_PASSWORD"; do
            if [ -n "$secret" ] && grep -rqF -- "$secret" $EXISTING 2>/dev/null; then
              echo "::error::a credential value appears in the journal — not publishing"; exit 3
            fi
          done
          git config user.name "forecast-scaffold-bot"
          git config user.email "bot@users.noreply.github.com"
          git add $EXISTING
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "exchange: paper journal + snapshots $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          exit 1

      - name: Preserve journal on publish failure
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unpublished-exchange-journal-${{ github.run_id }}
          path: |
            bot/journal/exchange.jsonl
            bot/journal/exchange-prices.jsonl
            bot/journal/exchange-arbs.jsonl
          retention-days: 30

      - name: Alert on job failure (one open issue, never hourly spam)
        if: ${{ failure() || cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Exchange paper bot needs attention"
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then echo "alert issue #$existing already open"; exit 0; fi
          {
            echo "Automated alert from the hourly exchange paper workflow: the job did not complete."
            echo
            echo "Journaled-but-unpublished rows (if any) are attached to the run as the"
            echo "unpublished-exchange-journal artifact. Common causes: leak-guard block, journal"
            echo "push conflict, the 55-minute timeout, an expired CLAUDE_CODE_OAUTH_TOKEN, a"
            echo "Betfair login failure (the run should still have continued Smarkets-only), or"
            echo "GitHub Actions failing to allocate a runner."
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "Close this issue once resolved — the next problem will open a fresh one."
          } > "$RUNNER_TEMP/failure-body.md"
          gh issue create --title "$title" --body-file "$RUNNER_TEMP/failure-body.md"
