name: Resolution sync

# Keeps bot/journal/resolutions.jsonl (platform resolution, normalized outcome, our own
# spot peer/baseline scores, PIT under our submitted CDF) up to date so bot/priors.py can
# read same-template prior facts. bench/sync_resolutions.py is incremental — it only
# appends/updates rows for newly resolved questions — so this is safe to run every 6h.
on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e .

      - name: Sync resolutions
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
        run: python bench/sync_resolutions.py --sleep 2.0 --verbose

      - name: Commit resolutions journal (no-op if unchanged)
        run: |
          git config user.name "forecast-scaffold-bot"
          git config user.email "bot@users.noreply.github.com"
          git add bot/journal/resolutions.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "bot: resolutions sync $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            git fetch origin main && git rebase origin/main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          exit 1
