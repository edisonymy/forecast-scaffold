name: List bot forecasts

# Read-only track record: every forecast this account holds, then the leaderboard
# standing per recent bot tournament (bench/standing.py; last, so it ends the log). Never submits. Manual
# trigger only.
on:
  workflow_dispatch:
    inputs:
      tournaments:
        description: "Extra tournament slugs to sweep (comma-separated), unioned with the forecaster_id sweep"
        default: "bot-testing-area"
      standing_slugs:
        description: "Extra tournament slugs for the standing report (MiniBench waves are not in the public list)"
        default: ""

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: List forecasts
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          TOURNAMENTS: ${{ inputs.tournaments }}
        run: python bot/list_forecasts.py
      - name: Standing
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          STANDING_SLUGS: ${{ inputs.standing_slugs }}
        run: python bench/standing.py --slugs "$STANDING_SLUGS" | tee -a "$GITHUB_STEP_SUMMARY"
